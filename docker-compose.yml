services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: llmllm
      POSTGRES_USER: llmllm
      POSTGRES_PASSWORD: llmllm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmllm -d llmllm"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
