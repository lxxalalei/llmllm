id: rule.mattermost.channel.update.public_to_private_conversion
title: 公开频道转私有需要专用转换权限
domain: mattermost.channel
capability: update
actor: requester
action: convert_channel_privacy
resource: channel
conditions:
  all:
  - field: channel.type
    operator: equals
    value: open
  - field: target_type
    operator: equals
    value: private
  - field: requester.permission.convert_public_channel_to_private
    operator: equals
    value: true
  any: []
decision: convert_channel_to_private
state_changes:
- kind: update
  target: channel.type
  detail: open to private
side_effects:
- kind: system_post
  target: channel
  detail: privacy change
exceptions:
- conditions:
    all:
    - field: channel.name
      operator: equals
      value: town-square
    any: []
  outcome: reject conversion
- conditions:
    all:
    - field: privacy_system_post
      operator: failed
      value: true
    any: []
  outcome: rollback channel.type and discoverable to previous values
source_fact_ids:
- eng.mattermost.channel.update.privacy_conversion.fact
