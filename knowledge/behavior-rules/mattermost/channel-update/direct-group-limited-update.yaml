id: rule.mattermost.channel.update.direct_group_limited_update
title: Direct/Group 只允许成员执行有限字段更新
domain: mattermost.channel
capability: update
actor: requester
action: update_channel_properties
resource: channel
conditions:
  all:
  - field: channel.type
    operator: in
    value:
    - direct
    - group
  - field: requester.is_channel_member
    operator: equals
    value: true
  any: []
decision: allow_limited_property_update
state_changes: []
side_effects: []
exceptions:
- conditions:
    all:
    - field: payload.changed_field
      operator: in
      value:
      - name
      - display_name
      - purpose
    any: []
  outcome: reject prohibited property change
source_fact_ids:
- eng.mattermost.channel.update.property_permission_by_type.fact
