id: rule.mattermost.channel.update.discoverability_patch_gate
title: 私有频道可发现性修改受类型、共享状态和权限限制
domain: mattermost.channel
capability: update
actor: requester
action: change_channel_discoverability
resource: channel
conditions:
  all:
  - field: feature.discoverable_channels
    operator: equals
    value: true
  - field: channel.type
    operator: equals
    value: private
  - field: channel.shared
    operator: equals
    value: false
  - field: requester.permission.manage_private_channel_discoverability
    operator: equals
    value: true
  any: []
decision: allow_discoverability_patch
state_changes: []
side_effects: []
exceptions: []
source_fact_ids:
- eng.mattermost.channel.update.discoverability_patch_gate.fact
