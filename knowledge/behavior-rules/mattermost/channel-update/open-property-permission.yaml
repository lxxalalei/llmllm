id: rule.mattermost.channel.update.open_property_permission
title: 公开频道属性更新需要 manage_public_channel_properties
domain: mattermost.channel
capability: update
actor: requester
action: update_channel_properties
resource: channel
conditions:
  all:
  - field: channel.type
    operator: equals
    value: open
  - field: requester.permission.manage_public_channel_properties
    operator: equals
    value: true
  any: []
decision: allow_channel_property_update
state_changes: []
side_effects: []
exceptions: []
source_fact_ids:
- eng.mattermost.channel.update.property_permission_by_type.fact
