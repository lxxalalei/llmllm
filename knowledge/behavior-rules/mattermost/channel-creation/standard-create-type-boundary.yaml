id: rule.mattermost.channel.creation.standard_create_type_boundary
title: 普通频道创建入口拒绝 Direct、Group、Board 和 Space
domain: mattermost.channel
capability: creation
actor: authenticated_user
action: create_standard_channel
resource: channel
conditions:
  all:
  - field: channel.type
    operator: in
    value:
    - direct
    - group
    - board
    - space
  any: []
decision: reject_standard_channel_creation
state_changes: []
side_effects: []
exceptions: []
source_fact_ids:
- eng.mattermost.channel.creation.create_permission_gate.fact
