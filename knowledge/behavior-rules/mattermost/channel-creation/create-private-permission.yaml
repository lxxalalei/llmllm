id: rule.mattermost.channel.creation.create_private_permission
title: 创建私有频道需要 create_private_channel
domain: mattermost.channel
capability: creation
actor: authenticated_user
action: create_private_channel
resource: channel
conditions:
  all:
  - field: session.authenticated
    operator: equals
    value: true
  - field: channel.type
    operator: equals
    value: private
  - field: requester.permission.create_private_channel
    operator: equals
    value: true
  any: []
decision: allow_standard_channel_creation
state_changes: []
side_effects: []
exceptions: []
source_fact_ids:
- eng.mattermost.channel.creation.create_permission_gate.fact
