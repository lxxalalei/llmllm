id: rule.mattermost.channel.permission.base_scheme_invariant
title: 常规角色更新必须保留成员基础 Scheme 身份
domain: mattermost.channel
capability: permission
actor: role_management_service
action: update_member_roles
resource: channel_member
conditions:
  all:
  - field: path
    operator: equals
    value: normal_api_or_plugin
  any: []
decision: require_scheme_user_or_guest
state_changes: []
side_effects: []
exceptions:
- conditions:
    all:
    - field: path
      operator: equals
      value: bulk_import_internal
    any: []
  outcome: may temporarily bypass base scheme check
source_fact_ids:
- eng.mattermost.channel.permission.base_scheme_invariant.fact
