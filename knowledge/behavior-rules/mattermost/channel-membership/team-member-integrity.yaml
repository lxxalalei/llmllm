id: rule.mattermost.channel.membership.team_member_integrity
title: 成员加入默认要求有效 TeamMember
domain: mattermost.channel
capability: membership
actor: membership_service
action: add_user_to_channel
resource: channel_member
conditions:
  all:
  - field: opts.skip_team_member_integrity_check
    operator: equals
    value: false
  any: []
decision: require_valid_team_member
state_changes: []
side_effects: []
exceptions:
- conditions:
    all:
    - field: opts.skip_team_member_integrity_check
      operator: equals
      value: true
    any: []
  outcome: this team-membership check is skipped for the explicit internal path
source_fact_ids:
- eng.mattermost.channel.membership.add_integrity_constraints.fact
