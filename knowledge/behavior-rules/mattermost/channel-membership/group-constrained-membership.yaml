id: rule.mattermost.channel.membership.group_constrained_membership
title: GroupConstrained 频道拒绝不满足群组约束的成员
domain: mattermost.channel
capability: membership
actor: membership_service
action: add_user_to_channel
resource: channel_member
conditions:
  all:
  - field: channel.group_constrained
    operator: equals
    value: true
  - field: target.passes_group_membership_filter
    operator: equals
    value: false
  any: []
decision: reject_member_add
state_changes: []
side_effects: []
exceptions: []
source_fact_ids:
- eng.mattermost.channel.membership.add_integrity_constraints.fact
