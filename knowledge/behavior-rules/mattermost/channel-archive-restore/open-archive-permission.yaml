id: rule.mattermost.channel.archive_restore.open_archive_permission
title: 归档公开频道需要 delete_public_channel
domain: mattermost.channel
capability: archive_restore
actor: requester
action: archive_channel
resource: channel
conditions:
  all:
  - field: channel.type
    operator: equals
    value: open
  - field: channel.archived
    operator: equals
    value: false
  - field: requester.permission.delete_public_channel
    operator: equals
    value: true
  any: []
decision: allow_archive_request
state_changes: []
side_effects: []
exceptions: []
source_fact_ids:
- eng.mattermost.channel.archive_restore.archive_permission_and_default.fact
