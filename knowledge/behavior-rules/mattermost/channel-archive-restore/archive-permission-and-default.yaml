id: rule.mattermost.channel.archive_restore.archive_permission_and_default
title: 归档频道按类型校验删除权限且保护默认频道
domain: mattermost.channel
capability: archive_restore
actor: requester
action: archive_channel
resource: channel
conditions:
  all:
  - field: channel.archived
    operator: equals
    value: false
  any:
  - field: channel.type
    operator: equals
    value: open
  - field: channel.type
    operator: equals
    value: private
decision: require_type_specific_archive_permission
state_changes: []
side_effects: []
exceptions:
- conditions:
    all:
    - field: channel.name
      operator: equals
      value: town-square
    any: []
  outcome: reject archive
source_fact_ids:
- eng.mattermost.channel.archive_restore.archive_permission_and_default.fact
